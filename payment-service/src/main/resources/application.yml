server:
  port: 8086

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: saud@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# ── Razorpay Credentials ─────────────────────────────────────────────────────
# Replace with your actual Razorpay Test/Live keys from https://dashboard.razorpay.com
razorpay:
  key-id: rzp_test_SfdZa5KLOejK5P      # your Razorpay Key ID
  key-secret: x1kwrJRRAmRZ102QNkAPCgbz  # your Razorpay Key Secret
  currency: INR
  webhook-secret: YOUR_WEBHOOK_SECRET      # set in Razorpay dashboard → Webhooks

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.quickbite.payment: DEBUG
    org.hibernate.SQL: DEBUG
