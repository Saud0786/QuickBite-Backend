server:
  port: 8082

spring:
  application:
    name: restaurant-service

  datasource:
    url: jdbc:mysql://localhost:3306/quickbite_restaurant?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: saud@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# JWT secret must match auth-service exactly for local token validation
jwt:
  secret: ${JWT_SECRET:feskhfhy229823rnsfh2oi3194ejenmasa}

# Auth-service URL (used for inter-service token validation via RestTemplate)
auth-service:
  url: http://auth-service

# Cloudinary Config
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.quickbite.restaurant: DEBUG
    org.springframework.security: INFO
